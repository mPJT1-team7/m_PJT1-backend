name: Deploy to EC2

on:
  push:
    branches: [ main ] # main 브랜치에 push될 때마다 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SSH Remote Commands
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}      # 탄력적 IP
          username: ${{ secrets.EC2_USERNAME }} # ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}     # .pem 키 내용
          script: |
            # 1. 프로젝트 폴더로 이동
            cd /home/${{ secrets.EC2_USERNAME }}/AI-Interview-Platform
            
            # 2. 모든 자바 프로세스 강제 종료
            # sudo를 붙여서 확실히 죽이고 시작합니다.
            sudo killall -9 java || true
            sudo fuser -k 8080/tcp || true
            
            # 3. Git 강제 동기화
            git fetch --all
            git reset --hard origin/main
            
            # 4. 기존 빌드 결과물 삭제
            rm -rf build
            
            # 5. GitHub Secrets 설정값으로 파일 생성
            echo "${{ secrets.DEV_YML }}" > ./src/main/resources/application-dev.yml
            echo "${{ secrets.ENV_FILE }}" > .env
            
            # 6. .env 파일의 변수들을 시스템 환경변수로 주입
            if [ -f .env ]; then
              export $(grep -v '^#' .env | xargs)
            fi
            
            # 7. Gradle 빌드
            chmod +x gradlew
            ./gradlew clean build -x test
            
            # 8. 새 JAR 파일 실행 
            nohup /usr/bin/java -jar \
              -Dspring.profiles.active=dev \
              -DOPEN_AI_KEY="${{ secrets.OPEN_AI_KEY }}" \
              -DOPEN_AI_MODEL="${{ secrets.OPEN_AI_MODEL }}" \
              -DOPEN_AI_URL="${{ secrets.OPEN_AI_URL }}" \
              build/libs/*[^plain].jar > /home/${{ secrets.EC2_USERNAME }}/app.log 2>&1 &
